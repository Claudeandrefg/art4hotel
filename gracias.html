<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Gracias · Art4Hotel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="Recursos/art4hotel-icono-verde.svg">
<style>
:root{--olive:#5C6B4F;--olive-dark:#3D4A33;--brown:#6B4F3C;--sand:#D4C5A9;--cream:#FAF7F0;--warm-gray:#8A8075}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:linear-gradient(135deg,#FAF7F0,#F5F0E5);min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:#2C2C2C}
.card{max-width:520px}
.seal{width:80px;height:80px;border-radius:18px;background:var(--olive);display:flex;align-items:center;justify-content:center;margin:0 auto 28px;box-shadow:0 10px 30px rgba(92,107,79,.25)}
.seal svg{width:46px;height:46px}
.eyebrow{font-family:'DM Sans',sans-serif;font-size:11px;color:var(--olive);text-transform:uppercase;letter-spacing:4px;font-weight:600;margin-bottom:16px}
h1{font-family:'Playfair Display',serif;font-style:italic;font-size:42px;color:var(--olive-dark);font-weight:400;line-height:1.1;margin-bottom:18px}
p{color:var(--warm-gray);font-size:16px;line-height:1.6;margin-bottom:30px}
.btn{display:inline-block;padding:13px 28px;background:var(--olive);color:#fff;text-decoration:none;border-radius:4px;font-size:13px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;transition:.2s}
.btn:hover{background:var(--olive-dark)}
.foot{margin-top:40px;font-family:'Playfair Display',serif;font-style:italic;color:var(--olive);font-size:15px;opacity:.7}
</style>
</head>
<body>
<div class="card">
    <div class="seal">
        <svg viewBox="0 0 24 24" fill="none" stroke="#FAF7F0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
    </div>
    <div class="eyebrow">Solicitud recibida</div>
    <h1>¡Gracias! Pronto sabrás de nosotros.</h1>
    <p>Hemos recibido tu solicitud de cotización. Nuestro equipo te responderá en menos de 24 horas con una propuesta personalizada.</p>
    <a href="/" class="btn">Volver al inicio</a>
    <div class="foot">Art4Hotel · Los Cabos</div>
</div>
</body>
</html>
